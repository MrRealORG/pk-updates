name: Build PK Launcher (free tier)

# Builds PK Launcher inside this PUBLIC repo so GitHub-hosted runners are
# free — releases no longer depend on the private repo's paid Actions minutes.
# The private source is pulled at run time with PRIVATE_SRC_PAT and never
# published here; only signed installer artifacts + latest.json land in
# this repo's releases, which is exactly what the in-app updater consumes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of talha2223/PK-Launcher- to build (tag or branch)'
        required: false
        default: 'main'

concurrency:
  group: build-${{ github.event.inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Build + Publish (Windows x64 + updater manifest)
    runs-on: windows-latest
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: 📥 Check out private source
        uses: actions/checkout@v4
        with:
          repository: talha2223/PK-Launcher-
          token: ${{ secrets.PRIVATE_SRC_PAT }}
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 2

      - name: 🧰 Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧰 Setup mise (node/pnpm/rust/turbo/cmake)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: 🦀 Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: ⚙️ Set application environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: 📦 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 🏷️ Determine version
        id: ver
        shell: bash
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [[ "$REF" == refs/tags/v* || "$REF" == v* ]]; then
            VERSION="${REF#refs/tags/}"; VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./apps/pk-launcher-ui/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (tag v$VERSION)"

      - name: 🔐 Write updater release config (endpoint + pubkey)
        shell: bash
        run: |
          cat > apps/app/tauri.release.conf.json <<'EOF'
          {
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": {
              "updater": {
                "endpoints": [
                  "https://github.com/MrRealORG/pk-updates/releases/latest/download/latest.json",
                  "https://github.com/talha2223/PK-Launcher-/releases/latest/download/latest.json"
                ],
                "pubkey": "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDkyODlEMUJCODQyNzU0RjQKUldUMFZDZUV1OUdKa2hwRE5ET3lJbmRQN1h3YVh2Umd3QTdQOW9FR2V1YzgzTFBndlFxZ0ZFTnYK"
              }
            }
          }
          EOF
          echo "--- tauri.release.conf.json ---"
          cat apps/app/tauri.release.conf.json

      - name: 🔨 Build signed PK Launcher (Tauri v2, NSIS + updater artifacts)
        shell: bash
        run: mise exec -- pnpm --filter @modrinth/app exec tauri build --target x86_64-pc-windows-msvc --config tauri.release.conf.json

      - name: 📄 Generate latest.json updater manifest
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = 'target/x86_64-pc-windows-msvc/release/bundle/nsis';
          const version = process.env.VERSION;
          const tag = process.env.TAG;
          const files = fs.readdirSync(dir);
          const setup = files.find(f => f.endsWith('-setup.exe'));
          const sig = files.find(f => f.endsWith('-setup.exe.sig'));
          if (!setup || !sig) throw new Error('setup.exe or .sig missing in ' + files.join(', '));
          const manifest = {
            version: version,
            notes: 'PK Launcher ' + version,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature: fs.readFileSync(path.join(dir, sig), 'utf8').trim(),
                // GitHub renames spaces in release asset names to dots, so the
                // download URL must use the dotted form to resolve.
                url: 'https://github.com/MrRealORG/pk-updates/releases/download/' + tag + '/' + encodeURIComponent(setup).replace(/%20/g, '.')
              }
            }
          };
          fs.writeFileSync(path.join(dir, 'latest.json'), JSON.stringify(manifest, null, 2));
          console.log('--- latest.json ---');
          console.log(fs.readFileSync(path.join(dir, 'latest.json'), 'utf8'));
          EOF

      - name: 🚀 Publish release on pk-updates (public updater channel)
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          NSIS=target/x86_64-pc-windows-msvc/release/bundle/nsis
          PORTABLE=$(ls target/x86_64-pc-windows-msvc/release/*.exe | head -1)
          if gh release view "$TAG" --repo MrRealORG/pk-updates >/dev/null 2>&1; then
            gh release upload "$TAG" --repo MrRealORG/pk-updates --clobber \
              "$NSIS/PK Launcher_${VERSION}_x64-setup.exe" \
              "$NSIS/PK Launcher_${VERSION}_x64-setup.exe.sig" \
              "$NSIS/latest.json" \
              "$PORTABLE"
          else
            gh release create "$TAG" \
              --repo MrRealORG/pk-updates \
              --title "PK Launcher v${VERSION}" \
              --notes "PK Launcher v${VERSION} — Windows x64 installer + portable exe. In-app auto-update channel (signed)." \
              "$NSIS/PK Launcher_${VERSION}_x64-setup.exe" \
              "$NSIS/PK Launcher_${VERSION}_x64-setup.exe.sig" \
              "$NSIS/latest.json" \
              "$PORTABLE"
          fi
          echo "✅ Released: https://github.com/MrRealORG/pk-updates/releases/tag/$TAG"
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SRC_PAT }}
